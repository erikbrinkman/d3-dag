name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun test
      - run: bun export
      - run: bun check:pkg
      - run: bun doc
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node dist/index.js
